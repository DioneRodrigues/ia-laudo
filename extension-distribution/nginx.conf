server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /eden-voice/ {
        autoindex off;
        types {
            application/x-chrome-extension crx;
            application/xml xml;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
